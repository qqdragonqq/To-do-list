<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>To do list</h1>
    <hr>
    <div id="alltasks">
        <div id="tasks">
            <p id="Yourtasks">Your tasks</p>
            <button id="add_task" onclick="open_overlay()">+ Add tasks</button>
        </div>
    </div>
    <div id="darkbg">
        <div id="overlay">
            <h1>What would you like to do?</h1>
            <input id="input" placeholder="Please enter task here." autofocus>
            <div class="button-row">
                <button id="cancel" class="overlay_btn" onclick="close_overlay()">Cancel</button>
                <button id="submit" class="overlay_btn" onclick="add_task()">Submit</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
